<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YellowFit Purchasing</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#202124;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#fff;padding:20px 16px 16px;border-bottom:1px solid #e4e6e9;position:sticky;top:0;z-index:5}
h1{font-size:22px;margin:0}.sub{color:#6b7280;font-size:13px;margin-top:4px}
main{max-width:760px;margin:auto;padding:16px 16px 100px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card,.item,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:15px;margin:10px 0}
.card{cursor:pointer}.card .icon{font-size:28px}.card strong{display:block;margin-top:6px}.muted{font-size:12px;color:#777}
.title{font-weight:800;margin:18px 0 8px;text-transform:uppercase;font-size:13px;color:#555;letter-spacing:.04em}
.search,input,select{width:100%;padding:12px;border:1px solid #d8dbe0;border-radius:10px;font-size:15px;background:#fff}
.search{margin:12px 0}
.itemrow{display:flex;justify-content:space-between;gap:10px;align-items:center}.itemname{font-weight:700}.unit{font-size:12px;color:#666;margin-top:3px}
.qty{display:flex;align-items:center;gap:7px}.qty button{border:0;background:#eee;border-radius:8px;padding:7px 11px;font-weight:800}.qtyinput{width:68px;text-align:center;padding:8px 5px;border:1px solid #d8dbe0;border-radius:8px;font-size:16px;font-weight:800;background:#fff}
button{border:0;border-radius:10px;padding:11px 13px;font-weight:750;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:#202124;color:#fff}.success{background:#25d366;color:#fff}.secondary{background:#eee}.danger{background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}
.back{margin-bottom:8px}.notice{background:#fff8df;border:1px solid #f0df9a;padding:12px;border-radius:10px;font-size:13px;margin:10px 0}
.error{background:#fff0f0;border:1px solid #f3b4b4;color:#8a1c1c;padding:12px;border-radius:10px;font-size:13px;margin:10px 0}
.successbox{background:#eefbf2;border:1px solid #b9e6c5;color:#176b2e;padding:12px;border-radius:10px;font-size:13px;margin:10px 0}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 6px}
.empty{text-align:center;color:#777;padding:30px 10px}
.smallbtn{padding:7px 9px;font-size:12px}
.pill{font-size:11px;padding:4px 7px;border-radius:8px;background:#e9f7ee;color:#187a3d}.off{background:#eee;color:#666}
.loading{text-align:center;padding:35px;color:#777}
.csvbox{background:#f8fafc;border:1px dashed #cbd5e1;padding:14px;border-radius:12px;margin:10px 0}.csvpreview{max-height:320px;overflow:auto;border:1px solid #e5e7eb;border-radius:10px;margin-top:10px}.csvtable{width:100%;border-collapse:collapse;font-size:12px}.csvtable th,.csvtable td{padding:8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.csvtable th{position:sticky;top:0;background:#f8fafc}.badrow{background:#fff0f0}.goodrow{background:#eefbf2}
.status{font-size:11px;padding:4px 7px;border-radius:8px;background:#e9f7ee;color:#187a3d;float:right}
textarea{width:100%;min-height:190px;padding:12px;border:1px solid #d8dbe0;border-radius:10px;font-family:inherit}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>YellowFit</h1>
  <div class="sub">Purchasing Catalog <span id="connectionStatus" class="status">Connecting...</span></div>
</header>
<main id="app"><div class="loading">Menghubungkan ke database...</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://lutabjsxkkwlkxriyrds.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_11BfIkV9YTcZf3xs9iLiIw_zZeoBtIa";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let db = { suppliers: [], items: [] };
let currentSupplier = null;
let cart = {};
let sorterLines = [];
let sorterResults = [];
let sorterDay = "";
let selectedOrderItems = {};

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function setStatus(ok){
  const el=document.getElementById("connectionStatus");
  if(!el)return;
  el.textContent=ok?"Online":"Offline";
  el.style.background=ok?"#e9f7ee":"#fee2e2";
  el.style.color=ok?"#187a3d":"#991b1b";
}

async function loadData(){
  const [{data:suppliers,error:sError},{data:items,error:iError}] = await Promise.all([
    client.from("suppliers").select("*").order("name"),
    client.from("items").select("*").order("name")
  ]);
  if(sError) throw sError;
  if(iError) throw iError;
  db.suppliers=suppliers||[];
  db.items=items||[];
  setStatus(true);
}

function getSupplier(id){return db.suppliers.find(s=>s.id===id)}
function activeItems(id){return db.items.filter(i=>i.supplier_id===id&&i.active)}

async function refreshAndRender(){
  await loadData();
  render();
}

function showError(message){
  document.getElementById("app").innerHTML =
    `<div class="error"><b>Terjadi masalah:</b><br>${esc(message)}<div class="actions"><button class="secondary" onclick="boot()">Coba Lagi</button></div></div>`;
}

async function boot(){
  document.getElementById("app").innerHTML='<div class="loading">Menghubungkan ke database...</div>';
  try{
    await loadData();
    render();
  }catch(e){
    console.error(e);
    setStatus(false);
    showError(e.message || "Tidak dapat terhubung ke Supabase.");
  }
}

function render(){
  if(currentSupplier) renderSupplier();
  else renderHome();
}

function renderHome(){
  const items=db.items.filter(i=>i.active).sort((a,b)=>a.name.localeCompare(b.name,'id'));
  let html=`<h2>🛒 Buat Order</h2>
  <div class="panel">
    <div class="title" style="margin-top:0">Pilih Item yang Mau Dipesan</div>
    <div class="muted">Centang item dari katalog. Setelah dicentang, masukkan jumlah yang ingin dipesan. Supplier akan dipilah otomatis oleh sistem.</div>
    <input id="orderItemSearch" class="search" placeholder="🔍 Cari nama item..." oninput="filterOrderItems(this.value)">
    <div id="orderItemList"></div>
    <label>📅 Hari Pengiriman</label>
    <select id="sorterDay">
      <option value="">Pilih hari...</option>
      <option>Senin</option><option>Selasa</option><option>Rabu</option><option>Kamis</option>
      <option>Jumat</option><option>Sabtu</option><option>Minggu</option>
    </select>
    <button class="primary" style="width:100%;margin-top:10px" onclick="generateSortedOrder()">🔎 Sortir & Generate Order</button>
  </div>
  <div id="sorterResult"></div>

  <div class="title">Menu Lain</div>
  <button class="secondary" style="width:100%;margin-bottom:8px" onclick="showSupplierCatalog()">📦 Lihat Katalog per Supplier</button>
  <button class="secondary" style="width:100%;margin-bottom:8px" onclick="manage()">⚙️ Kelola Katalog</button>
  <div class="notice">Kamu tidak perlu mencari supplier. Cukup centang item dan masukkan jumlah; sistem akan otomatis mengelompokkan order berdasarkan supplier.</div>`;
  document.getElementById("app").innerHTML=html;
  filterOrderItems("");
}

function filterOrderItems(q){
  const box=document.getElementById("orderItemList");
  if(!box)return;
  const query=String(q||'').trim().toLowerCase();
  const items=db.items.filter(i=>i.active && i.name.toLowerCase().includes(query))
    .sort((a,b)=>a.name.localeCompare(b.name,'id'));

  box.innerHTML=items.length?items.map(i=>{
    const selected=Object.prototype.hasOwnProperty.call(selectedOrderItems,i.id);
    const qty=selectedOrderItems[i.id]??'';
    return `<div class="item" style="padding:12px">
      <div class="itemrow" style="align-items:center">
        <label style="display:flex;align-items:center;gap:10px;margin:0;flex:1;cursor:pointer">
          <input type="checkbox" style="width:20px;height:20px;flex:0 0 auto" ${selected?'checked':''}
            onchange="toggleOrderItem('${i.id}',this.checked)">
          <span>
            <span class="itemname" style="display:block">${esc(i.name)}</span>
            <span class="unit">${esc(i.unit)}</span>
          </span>
        </label>
        <input class="qtyinput" style="${selected?'display:block':'display:none'}" type="number" min="0" step="any" inputmode="decimal"
          value="${esc(qty)}" placeholder="Qty" aria-label="Jumlah ${esc(i.name)}"
          oninput="setOrderItemQty('${i.id}',this.value)">
      </div>
    </div>`;
  }).join(""):`<div class="empty">Item tidak ditemukan.</div>`;
}

function toggleOrderItem(id,checked){
  if(checked){
    if(!Object.prototype.hasOwnProperty.call(selectedOrderItems,id)) selectedOrderItems[id]='';
  }else{
    delete selectedOrderItems[id];
  }
  const q=document.getElementById('orderItemSearch')?.value||'';
  filterOrderItems(q);
}

function setOrderItemQty(id,value){
  if(Object.prototype.hasOwnProperty.call(selectedOrderItems,id)){
    selectedOrderItems[id]=String(value??'').replace(',','.');
  }
}

function showSupplierCatalog(){
  let html=`<button class="secondary back" onclick="home()">← Buat Order</button>
  <div class="title">Katalog per Supplier</div><div class="grid">`;
  db.suppliers.filter(s=>s.active).forEach(s=>{
    html+=`<div class="card" onclick="showSupplier('${s.id}')">
      <div class="icon">${esc(s.icon||"📦")}</div>
      <strong>${esc(s.name)}</strong>
      <span class="muted">${activeItems(s.id).length} items tersedia</span>
    </div>`;
  });
  html+=`</div>`;
  document.getElementById("app").innerHTML=html;
}

function normalizeItemName(s){
  return String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
}

function parseSorterLine(line){
  let raw=String(line||'').trim();
  if(!raw)return null;
  // Accept: Item | 80, Item - 80, Item — 80, or Item<TAB>80.
  let item='', qtyText='';
  const parts=raw.split(/\s*[|—–]\s*|\s+-\s+/);
  if(parts.length>=2){
    item=parts[0].trim(); qtyText=parts.slice(1).join(' ').trim();
  }else if(raw.includes('\t')){
    const p=raw.split('\t'); item=p[0].trim(); qtyText=p.slice(1).join(' ').trim();
  }else{
    const m=raw.match(/^(.*?)(?:\s+)(\d+(?:[.,]\d+)?)\s*(?:kg|g|gr|gram|ml|l|liter|pcs|pc|ikat|botol|pack|dus|box)?$/i);
    if(m){item=m[1].trim();qtyText=m[2];}
    else item=raw;
  }
  let qty='';
  if(qtyText){
    const m=qtyText.match(/\d+(?:[.,]\d+)?/);
    if(m) qty=m[0].replace(',','.');
  }
  return {raw,item,qty};
}

function generateSortedOrder(){
  const day=document.getElementById('sorterDay')?.value||'';
  const selectedIds=Object.keys(selectedOrderItems);
  if(!selectedIds.length){alert('Centang minimal satu item terlebih dahulu.');return;}
  if(!day){alert('Pilih hari pengiriman terlebih dahulu.');return;}

  const missingQty=selectedIds.filter(id=>{
    const n=parseFloat(String(selectedOrderItems[id]).replace(',','.'));
    return !Number.isFinite(n) || n<=0;
  });
  if(missingQty.length){
    const names=missingQty.map(id=>db.items.find(i=>i.id===id)?.name).filter(Boolean);
    alert(`Masih ada ${missingQty.length} item yang belum diisi jumlahnya:\n\n${names.join('\n')}`);
    return;
  }

  sorterDay=day;
  sorterResults=selectedIds.map((id,index)=>{
    const item=db.items.find(i=>i.id===id);
    return {
      index,
      raw:item?.name||'',
      item:item?.name||'',
      qty:String(selectedOrderItems[id]).replace(',','.'),
      matches:item?[item]:[],
      selectedId:item?.id||null
    };
  }).filter(x=>x.selectedId);

  sorterLines=sorterResults.map(x=>({item:x.item,qty:x.qty}));
  renderSorterResults();
}

function renderSorterResults(){
  const box=document.getElementById('sorterResult'); if(!box)return;
  const unmatched=sorterResults.filter(x=>x.matches.length===0);
  const ambiguous=sorterResults.filter(x=>x.matches.length>1 && !x.selectedId);
  const matched=sorterResults.filter(x=>x.selectedId);
  const groups={};
  matched.forEach(x=>{
    const item=db.items.find(i=>i.id===x.selectedId); if(!item)return;
    const supplier=getSupplier(item.supplier_id); if(!supplier)return;
    (groups[supplier.id] ||= {supplier,items:[]}).items.push({x,item});
  });

  let html=`<div class="title">Hasil Sortiran per Supplier</div>`;
  if(!matched.length && !unmatched.length && !ambiguous.length){box.innerHTML='';return;}
  if(unmatched.length) html+=`<div class="error"><b>❌ Item tidak ditemukan (${unmatched.length})</b><br>${unmatched.map(x=>esc(x.item)).join(', ')}<br><span class="muted">Pastikan nama item sama dengan nama di katalog.</span></div>`;
  if(ambiguous.length) html+=`<div class="notice"><b>⚠️ Ada item dengan lebih dari satu supplier</b><br>Silakan pilih supplier untuk item berikut.</div>`;
  ambiguous.forEach(x=>{
    html+=`<div class="item"><div class="itemname">${esc(x.item)}</div><div class="muted">${x.qty?`Jumlah: ${esc(x.qty)}`:'Jumlah belum diisi'}</div>
      <select onchange="selectSorterSupplier(${x.index},this.value)">
        <option value="">Pilih supplier...</option>
        ${x.matches.map(i=>`<option value="${i.id}">${esc(getSupplier(i.supplier_id)?.name||'Supplier')}</option>`).join('')}
      </select></div>`;
  });

  Object.values(groups).forEach(g=>{
    html+=`<div class="panel"><h3 style="margin:0 0 8px">${esc(g.supplier.icon||'📦')} ${esc(g.supplier.name)}</h3>`;
    g.items.forEach(({x,item})=>{
      html+=`<div class="itemrow" style="padding:9px 0;border-bottom:1px solid #eee">
        <div><div class="itemname">${esc(item.name)}</div><div class="unit">${esc(item.unit)}</div></div>
        <input class="qtyinput" type="number" min="0" step="any" inputmode="decimal" value="${esc(x.qty)}" placeholder="Qty" onchange="updateSorterQty(${x.index},this.value)">
      </div>`;
    });
    html+=`<button class="success" style="width:100%;margin-top:10px" onclick="copySupplierOrder('${g.supplier.id}')">📋 Copy Order ${esc(g.supplier.name)}</button></div>`;
  });

  const ready=Object.keys(groups).length && !unmatched.length && !ambiguous.length;
  if(ready) html+=`<button class="primary" style="width:100%;margin-bottom:10px" onclick="copyAllSortedOrders()">📋 Copy Semua Order</button>`;
  html+=`<button class="secondary" style="width:100%" onclick="clearSorter()">↺ Mulai Lagi</button>`;
  box.innerHTML=html;
}

function selectSorterSupplier(index,id){
  if(sorterResults[index]) sorterResults[index].selectedId=id||null;
  renderSorterResults();
}

function updateSorterQty(index,value){
  if(!sorterResults[index])return;
  const n=parseFloat(String(value).replace(',','.'));
  sorterResults[index].qty=Number.isFinite(n)&&n>=0?String(n):'';
}

function buildSupplierText(supplierId){
  const supplier=getSupplier(supplierId); if(!supplier)return '';
  const rows=sorterResults.filter(x=>x.selectedId && db.items.find(i=>i.id===x.selectedId)?.supplier_id===supplierId);
  const lines=rows.map(x=>{
    const item=db.items.find(i=>i.id===x.selectedId);
    return `${item.name} — ${x.qty ? x.qty+' '+item.unit : '(jumlah belum diisi)'}`;
  }).join('\n');
  return `🛒 ORDER YELLOWFIT\nSupplier: ${supplier.name}\nHari Pengiriman: ${sorterDay}\n\n${lines}\n\nTerima kasih.`;
}

async function copySupplierOrder(supplierId){
  const text=buildSupplierText(supplierId);
  if(!text)return;
  const rows=sorterResults.filter(x=>x.selectedId && db.items.find(i=>i.id===x.selectedId)?.supplier_id===supplierId);
  if(rows.some(x=>!x.qty)){alert('Masih ada item yang belum diisi jumlahnya.');return;}
  try{await navigator.clipboard.writeText(text);alert('Order berhasil di-copy. Silakan paste ke chat supplier.');}
  catch(e){prompt('Copy order berikut:',text);}
}

async function copyAllSortedOrders(){
  const selected=sorterResults.filter(x=>x.selectedId);
  if(selected.some(x=>!x.qty)){alert('Masih ada item yang belum diisi jumlahnya.');return;}
  const supplierIds=[...new Set(selected.map(x=>db.items.find(i=>i.id===x.selectedId)?.supplier_id).filter(Boolean))];
  const text=supplierIds.map(buildSupplierText).join('\n\n--------------------\n\n');
  try{await navigator.clipboard.writeText(text);alert('Semua order berhasil di-copy.');}
  catch(e){prompt('Copy semua order berikut:',text);}
}

function clearSorter(){sorterLines=[];sorterResults=[];sorterDay='';selectedOrderItems={};renderHome();}

function showSupplier(id){currentSupplier=id;cart={};render()}
function home(){currentSupplier=null;cart={};render()}

function renderSupplier(){
  const s=getSupplier(currentSupplier);
  let html=`<button class="secondary back" onclick="home()">← Semua Supplier</button>
  <h2>${esc(s.icon||"📦")} ${esc(s.name)}</h2>
  <div class="muted">${activeItems(s.id).length} item tersedia</div>
  <input id="itemSearch" class="search" placeholder="🔍 Cari item..." oninput="filterItems(this.value)">
  <div id="itemList"></div>
  <button class="success" style="width:100%;margin-top:8px" onclick="reviewOrder()">📋 Review & Copy Order</button>
  <button class="secondary" style="width:100%;margin-top:8px" onclick="manageSupplierItems('${s.id}')">⚙️ Kelola Item ${esc(s.name)}</button>`;
  document.getElementById("app").innerHTML=html;
  filterItems("");
}

function filterItems(q){
  const box=document.getElementById("itemList");
  if(!box)return;
  const items=activeItems(currentSupplier).filter(i=>i.name.toLowerCase().includes(q.toLowerCase()));
  box.innerHTML=items.length?items.map(i=>{
    const n=cart[i.id]||0;
    return `<div class="item"><div class="itemrow">
      <div><div class="itemname">${esc(i.name)}</div><div class="unit">${esc(i.unit)}</div></div>
      <div class="qty">
        <button onclick="changeQty('${i.id}',-1)">−</button>
        <input class="qtyinput" type="number" min="0" step="1" inputmode="decimal" value="${n}" aria-label="Jumlah ${esc(i.name)}"
          onchange="setQty('${i.id}',this.value)"
          oninput="setQty('${i.id}',this.value)">
        <button onclick="changeQty('${i.id}',1)">+</button>
      </div>
    </div></div>`;
  }).join(""):`<div class="empty">Item tidak ditemukan.</div>`;
}

function changeQty(id,n){
  cart[id]=Math.max(0,(cart[id]||0)+n);
  if(!cart[id])delete cart[id];
  filterItems(document.getElementById("itemSearch")?.value||"");
}

function setQty(id,value){
  let n=parseInt(value,10);
  if(!Number.isFinite(n)||n<0)n=0;
  cart[id]=n;
  if(!n)delete cart[id];
}

function reviewOrder(){
  const ids=Object.keys(cart);
  if(!ids.length){alert("Belum ada item yang dipilih.");return}
  const s=getSupplier(currentSupplier);
  let html=`<button class="secondary back" onclick="renderSupplier()">← Kembali ke ${esc(s.name)}</button>
  <h2>📋 Order ${esc(s.name)}</h2><div class="panel">`;
  ids.forEach(id=>{
    const i=db.items.find(x=>x.id===id);
    if(i) html+=`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee"><span>${esc(i.name)}</span><b>${cart[id]} ${esc(i.unit)}</b></div>`;
  });
  html+=`<label>📅 Hari Pengiriman</label>
  <select id="deliveryDay">
    <option value="">Pilih hari...</option>
    <option>Senin</option><option>Selasa</option><option>Rabu</option><option>Kamis</option>
    <option>Jumat</option><option>Sabtu</option><option>Minggu</option>
  </select>
  <div class="actions"><button class="primary" onclick="copyOrder()">📋 Copy Order</button></div>
  <div class="notice">Setelah di-copy, paste order ini ke chat pribadi Anda untuk diperiksa sebelum diteruskan ke grup supplier.</div>
  </div>`;
  document.getElementById("app").innerHTML=html;
}

async function copyOrder(){
  const day=document.getElementById("deliveryDay").value;
  if(!day){alert("Pilih hari pengiriman terlebih dahulu.");return}
  const s=getSupplier(currentSupplier);
  const lines=Object.entries(cart).map(([id,q])=>{
    const i=db.items.find(x=>x.id===id);
    return `${i.name} — ${q} ${i.unit}`;
  }).join("\n");
  const text=`🛒 ORDER YELLOWFIT\nSupplier: ${s.name}\nHari Pengiriman: ${day}\n\n${lines}\n\nTerima kasih.`;
  try{
    await navigator.clipboard.writeText(text);
    alert("Order berhasil di-copy. Silakan paste ke chat Anda.");
  }catch(e){
    prompt("Copy order berikut:",text);
  }
}

/* ---------- CATALOG MANAGEMENT ---------- */

function manage(){
  currentSupplier=null;
  document.getElementById("app").innerHTML=`<button class="secondary back" onclick="home()">← Purchasing</button>
  <h2>⚙️ Kelola Katalog</h2>
  <div class="notice">Perubahan di sini tersimpan ke database online dan akan terlihat oleh seluruh purchasing.</div>
  <div class="actions">
    <button class="primary" onclick="newItem()">＋ Tambah Item</button>
    <button class="secondary" onclick="importCSV()">📥 Import CSV</button>
  </div>
  <button class="secondary" style="width:100%;margin-bottom:4px" onclick="manageSuppliers()">🏪 Kelola Supplier</button>
  <input class="search" id="manageSearch" placeholder="🔍 Cari item..." oninput="renderManageItems(this.value)">
  <div id="manageItems"></div>`;
  renderManageItems("");
}

function renderManageItems(q){
  const box=document.getElementById("manageItems");if(!box)return;
  const items=db.items.filter(i=>i.name.toLowerCase().includes(q.toLowerCase()));
  if(!items.length){box.innerHTML='<div class="empty">Tidak ada item.</div>';return}
  box.innerHTML=items.map(i=>{
    const s=getSupplier(i.supplier_id);
    return `<div class="item"><div class="itemrow">
      <div><div class="itemname">${esc(i.name)}</div><div class="unit">${esc(s?.icon||"")} ${esc(s?.name||"—")} · ${esc(i.unit)}</div></div>
      <div><span class="pill ${i.active?'':'off'}">${i.active?'Active':'Inactive'}</span></div>
    </div>
    <div class="actions">
      <button class="secondary smallbtn" onclick="editItem('${i.id}')">Edit</button>
      <button class="${i.active?'danger':'success'} smallbtn" onclick="toggleItem('${i.id}')">${i.active?'Nonaktifkan':'Aktifkan'}</button>
    </div></div>`;
  }).join("");
}

  document.getElementById("app").innerHTML=`<button class="secondary back" onclick="manage()">← Kelola Katalog</button>
  <h2>📥 Import Item dari CSV</h2>
  <div class="notice"><b>Format CSV:</b> satu baris untuk satu item. Gunakan hanya 3 kolom: <b>supplier, item, unit</b>. Item yang diimport otomatis aktif.</div>
  <div class="csvbox">
    <b>Contoh isi:</b>
    <pre style="white-space:pre-wrap;font-size:12px;margin:8px 0 0">supplier,item,unit
Daging,Dada Fillet,kg
Daging,Dada Finger,kg
Pasar,Bawang Merah,kg
Grosir,BBQ Sauce,botol</pre>
  </div>
  <div class="actions">
    <button class="secondary" onclick="downloadCSVTemplate()">⬇️ Download Template</button>
  </div>

  <input id="csvFile" type="file" accept=".csv,text/csv" onchange="previewCSV(this.files[0])">

function downloadCSVTemplate(){
  const csv='supplier,item,unit\nDaging,Dada Fillet,kg,true\nDaging,Dada Finger,kg,true\nPasar,Bawang Merah,kg,true\nFrozen,Jagung Pipil,kg,true\nGrosir,BBQ Sauce,botol,true\n';
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='yellowfit_item_import_template.csv'; a.click();
  URL.revokeObjectURL(url);
}

function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const firstLine=(text.split(/\r?\n/).find(line=>line.trim()!=='')||'');
  const commaCount=(firstLine.match(/,/g)||[]).length;
  const semicolonCount=(firstLine.match(/;/g)||[]).length;
  const delimiter=semicolonCount>commaCount?';':',';

  const rows=[]; let row=[], cell='', quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i]; const next=text[i+1];
    if(quoted){
      if(c==='"' && next==='"'){cell+='"'; i++;}
      else if(c==='"') quoted=false;
      else cell+=c;
    }else{
      if(c==='"') quoted=true;
      else if(c===delimiter){row.push(cell);cell='';}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
      else if(c==='\r'){if(next==='\n') i++;row.push(cell);rows.push(row);row=[];cell='';}
      else cell+=c;
    }
  }
  if(cell!=='' || row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(v=>String(v).trim()!==''));
}

function normalizeHeader(v){
  return String(v||'').trim().toLowerCase().replace(/\s+/g,'_');
}

function csvBool(v){
  const x=String(v??'').trim().toLowerCase();
  if(!x)return true;
  return ['true','1','yes','y','active','aktif'].includes(x);
}

let pendingCSV=[];

async function previewCSV(file){
  const box=document.getElementById('csvPreview'); if(!box)return;
  if(!file){box.innerHTML='';return;}
  try{
    const text=await file.text();
    const rows=parseCSV(text);
    if(rows.length<2) throw new Error('CSV tidak memiliki data item.');
    const headers=rows[0].map(normalizeHeader);
    const supplierIdx=headers.findIndex(h=>['supplier','suppliers','nama_supplier'].includes(h));
    const itemIdx=headers.findIndex(h=>['item','nama_item','name','nama'].includes(h));
    const unitIdx=headers.findIndex(h=>['unit','satuan'].includes(h));
    if(supplierIdx<0 || itemIdx<0 || unitIdx<0) throw new Error('Kolom wajib tidak lengkap. Gunakan 3 kolom: supplier, item, unit.');

    pendingCSV=rows.slice(1).map((r,n)=>{
      const supplierName=String(r[supplierIdx]??'').trim();
      const itemName=String(r[itemIdx]??'').trim();
      const unit=String(r[unitIdx]??'').trim()||'unit';
      const active=true;
      const supplier=db.suppliers.find(s=>s.name.trim().toLowerCase()===supplierName.toLowerCase());
      let error='';
      if(!supplierName) error='Supplier kosong';
      else if(!supplier) error=`Supplier "${supplierName}" tidak ditemukan`;
      else if(!itemName) error='Nama item kosong';
      return {line:n+2,supplierName,itemName,unit,active,supplier,error};
    });

    // Detect duplicate item+supplier pairs inside the CSV itself.
    const seenCSV=new Map();
    pendingCSV.forEach(x=>{
      if(x.error || !x.supplier) return;
      const key=x.supplier.id+'::'+x.itemName.trim().toLowerCase();
      if(seenCSV.has(key)){
        x.error=`Duplikat di CSV (sama dengan baris ${seenCSV.get(key)})`;
      }else{
        seenCSV.set(key,x.line);
      }
    });

    // Mark rows that already exist in the online database, without treating them as errors.
    pendingCSV.forEach(x=>{
      if(x.error || !x.supplier) return;
      const existing=db.items.find(i=>i.supplier_id===x.supplier.id && i.name.trim().toLowerCase()===x.itemName.trim().toLowerCase());
      if(existing) x.existing=true;
    });

    const valid=pendingCSV.filter(x=>!x.error).length;
    const invalid=pendingCSV.length-valid;
    const newCount=pendingCSV.filter(x=>!x.error && !x.existing).length;
    const updateCount=pendingCSV.filter(x=>!x.error && x.existing).length;
    const duplicateCount=pendingCSV.filter(x=>x.error && x.error.startsWith('Duplikat di CSV')).length;
    const otherErrorCount=invalid-duplicateCount;
    const shown=pendingCSV.slice(0,100);
    box.innerHTML=`<div class="successbox">
        <b>${newCount}</b> item baru · <b>${updateCount}</b> item akan diperbarui
        ${duplicateCount?` · <b>${duplicateCount}</b> duplikat dalam CSV`:''}
        ${otherErrorCount?` · <b>${otherErrorCount}</b> error`:''}
      </div>
      <div class="notice" style="margin-top:10px">
        Item yang sudah ada <b>tidak dibuat ulang</b>; datanya akan diperbarui.
        Duplikat di dalam file CSV harus diperbaiki sebelum import.
      </div>
      <div class="csvpreview"><table class="csvtable"><thead><tr><th>Baris</th><th>Supplier</th><th>Item</th><th>Unit</th><th>Status</th></tr></thead><tbody>
      ${shown.map(x=>`<tr class="${x.error?'badrow':(x.existing?'':'goodrow')}"><td>${x.line}</td><td>${esc(x.supplierName)}</td><td>${esc(x.itemName)}</td><td>${esc(x.unit)}</td><td>${esc(x.error||(x.existing?'Sudah ada → akan diperbarui':'Item baru'))}</td></tr>`).join('')}</tbody></table></div>
      ${pendingCSV.length>100?'<div class="muted" style="margin-top:8px">Preview menampilkan 100 baris pertama.</div>':''}
      <div class="actions"><button class="primary" ${invalid?'disabled':''} onclick="runCSVImport()">📥 Import ${valid} Item</button><button class="secondary" onclick="importCSV()">Batal</button></div>`;
  }catch(e){
    pendingCSV=[];
    box.innerHTML=`<div class="error">${esc(e.message||'CSV tidak dapat dibaca.')}</div>`;
  }
}

async function runCSVImport(){
  const rows=pendingCSV.filter(x=>!x.error);
  if(!rows.length){alert('Tidak ada item yang siap diimport.');return}
  const btns=document.querySelectorAll('#csvPreview button');btns.forEach(b=>b.disabled=true);
  try{
    const inserts=[]; const updates=[];
    const seenRun=new Set();
    for(const r of rows){
      const key=r.supplier.id+'::'+r.itemName.trim().toLowerCase();
      if(seenRun.has(key)) continue;
      seenRun.add(key);
      const existing=db.items.find(i=>i.supplier_id===r.supplier.id && i.name.trim().toLowerCase()===r.itemName.trim().toLowerCase());
      if(existing) updates.push({id:existing.id,name:r.itemName,unit:r.unit,active:r.active});
      else inserts.push({name:r.itemName,supplier_id:r.supplier.id,unit:r.unit,active:r.active});
    }
    if(inserts.length){
      const {error}=await client.from('items').insert(inserts);
      if(error)throw error;
    }
    for(const u of updates){
      const {error}=await client.from('items').update({name:u.name,unit:u.unit,active:u.active}).eq('id',u.id);
      if(error)throw error;
    }
    await refreshAndRender();
    alert(`Import selesai. ${inserts.length} item baru ditambahkan dan ${updates.length} item yang sudah ada diperbarui.`);
    manage();
  }catch(e){
    console.error(e);
    alert('Import gagal: '+(e.message||'Unknown error')+'\n\nJika sebagian data sudah masuk, cek katalog sebelum mencoba lagi.');
    btns.forEach(b=>b.disabled=false);
  }
}

async function saveItem(id){
  const name=document.getElementById("fName").value.trim();
  const supplier_id=document.getElementById("fSupplier").value;
  const unit=document.getElementById("fUnit").value.trim()||"unit";
  if(!name){alert("Nama item wajib diisi.");return}
  try{
    let error;
    if(id){
      ({error}=await client.from("items").update({name,supplier_id,unit}).eq("id",id));
    }else{
      ({error}=await client.from("items").insert({name,supplier_id,unit,active:true}));
    }
    if(error)throw error;
    await refreshAndRender();
    alert(id?"Item berhasil diperbarui.":"Item berhasil ditambahkan.");
    manage();
  }catch(e){
    console.error(e);
    alert("Gagal menyimpan item: "+(e.message||"Unknown error"));
  }
}

async function toggleItem(id){
  const i=db.items.find(x=>x.id===id);
  if(!i)return;
  const action=i.active?"menonaktifkan":"mengaktifkan";
  if(!confirm(`Anda akan ${action} "${i.name}". Perubahan akan terlihat pada katalog. Lanjutkan?`))return;
  try{
    const {error}=await client.from("items").update({active:!i.active}).eq("id",id);
    if(error)throw error;
    await refreshAndRender();
    manage();
  }catch(e){
    alert("Gagal mengubah status item: "+(e.message||"Unknown error"));
  }
}

  box.innerHTML=items.length?items.map(i=>`<div class="item"><div class="itemrow">

async function toggleItemFromSupplier(itemId,supplierId){
  const i=db.items.find(x=>x.id===itemId);if(!i)return;
  const action=i.active?"menonaktifkan":"mengaktifkan";
  if(!confirm(`Anda akan ${action} "${i.name}". Lanjutkan?`))return;
  try{
    const {error}=await client.from("items").update({active:!i.active}).eq("id",itemId);
    if(error)throw error;
    await refreshAndRender();
    manageSupplierItems(supplierId);
  }catch(e){alert("Gagal mengubah status item: "+(e.message||"Unknown error"))}
}

    let error;
    if(id){
      ({error}=await client.from("suppliers").update({name,icon,active}).eq("id",id));
    }else{
      ({error}=await client.from("suppliers").insert({name,icon,active}));

}
